server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        # --- Release Service Routes ---
        - id: release-service-docs
          uri: http://release-service:8082
          predicates:
            - Path=/v3/api-docs/release-service
          filters:
            - SetPath=/v3/api-docs

        - id: release-service-api
          uri: http://release-service:8082
          predicates:
            - Path=/api/releases/**

        # --- Risk Service Routes ---
        - id: risk-service-docs
          uri: http://risk-service:8083
          predicates:
            - Path=/v3/api-docs/risk-service
          filters:
            - SetPath=/v3/api-docs

        - id: risk-service-api
          uri: http://risk-service:8083
          predicates:
            - Path=/api/risk/**

        # --- Notification Service Routes ---
        - id: notification-service-docs
          uri: http://notification-service:8085
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - SetPath=/v3/api-docs

        - id: notification-service-api
          uri: http://notification-service:8085
          predicates:
            - Path=/api/notifications/**

        - id: notification-service-ws
          uri: ws://notification-service:8085
          predicates:
            - Path=/ws/notifications/**
            
        # --- User Service Routes ---
        - id: user-service-docs
          uri: http://user-service:8086
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - SetPath=/v3/api-docs

        - id: user-service-api
          uri: http://user-service:8086
          predicates:
            - Path=/api/users/**
