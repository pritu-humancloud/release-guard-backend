spring.application.name=notification-service

server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5432/release_guard
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topics.risk-calculated=risk.calculated
app.kafka.topics.release-status-changed=release.status.changed
app.kafka.topics.incident-created=health.incident.created

springdoc.swagger-ui.enabled=true
